name: Reusable Docker Workflow
on:
    workflow_call:
        inputs:
            image_name:
                required: true
                type: string
            tag:
                required: true
                type: string
        secrets:
            docker_username:
                required: true
            docker_token:
                required: true
        outputs:
            image_url:
                value: ${{ jobs.build-and-push.outputs.iurl }}
jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.docker_username }}
                password: ${{ secrets.docker_token }}
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: |
                    ${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}
            - name: Set Image URL
              id: set-image-url
              run: |
                echo "url=${{ vars.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
        outputs:
            iurl: "${{ steps.set-image-url.outputs.url }}"
